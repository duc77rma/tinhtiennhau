<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #141222 0%, #0b0a14 58%, #05050a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-stage {
      position: relative;
      width: min(92vw, 92vh, 680px);
      height: min(92vw, 92vh, 680px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Quầng sáng nền nhịp nhàng phía sau */
    .ambient-glow {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(215, 38, 82, 0.26) 0%, rgba(130, 15, 45, 0.1) 50%, rgba(0, 0, 0, 0) 75%);
      filter: blur(22px);
      will-change: transform, opacity;
      pointer-events: none;
    }

    canvas {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      will-change: transform;
      transform: translateZ(0);
    }
  </style>
</head>

<body>
  <div class="heart-stage">
    <div class="ambient-glow" id="glow"></div>
    <canvas id="heart"></canvas>
  </div>

  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('heart');
      var glowEl = document.getElementById('glow');
      var ctx = canvas.getContext('2d');
      var isMobile = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent) ||
        Math.min(window.innerWidth, window.innerHeight) < 600;

      /*
       * Cấu hình số lượng hạt tối ưu 60fps/120fps mượt mà
       */
      var CONFIG = {
        bandCount: isMobile ? 3200 : 5800,   // Viền hồng sáng dày đặc
        innerCount: isMobile ? 1100 : 2000,  // Hạt bên trong lòng tim
        haloCount: isMobile ? 1900 : 3400,   // Hạt đỏ đô rìa ngoài lởm chởm
        sparkCount: isMobile ? 90 : 180,     // Bụi hạt bay lơ lửng quanh rìa
        beatPeriod: 1.1                      // Chu kỳ 1 nhịp đập (giây) - mạnh và liên tục hơn
      };

      // Bảng màu chuẩn theo ảnh mẫu
      var PALETTE = [
        '#ffe6ec', // 0: hồng phấn cực sáng (tâm viền)
        '#ffb6c4', // 1: hồng nhạt sáng
        '#ff8da3', // 2: hồng san hô (viền chính)
        '#e86480', // 3: hồng đậm
        '#bd3b5a', // 4: đỏ hồng trầm (lòng tim)
        '#9c2242', // 5: đỏ đô sáng (rìa trong)
        '#781430', // 6: đỏ đô đậm (rìa ngoài)
        '#540b20'  // 7: đỏ rượu vang sẫm (bụi rìa xa)
      ];

      function gauss() {
        var u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function expRand(mean) {
        return -Math.log(1 - Math.random()) * mean;
      }

      /*
       * Tạo sprite hạt mềm mượt có độ sắc nét ở tâm + viền mượt (chống răng cưa khi di chuyển)
       */
      function createDotSprite(hexColor) {
        var sz = 16;
        var c = document.createElement('canvas');
        c.width = c.height = sz;
        var g = c.getContext('2d');
        var r = sz / 2;
        var grad = g.createRadialGradient(r, r, 0, r, r, r);
        grad.addColorStop(0, hexColor);
        grad.addColorStop(0.42, hexColor);
        grad.addColorStop(0.75, hexColor + '66');
        grad.addColorStop(1, hexColor + '00');
        g.fillStyle = grad;
        g.fillRect(0, 0, sz, sz);
        return c;
      }

      var SPRITES = PALETTE.map(createDotSprite);

      /*
       * Đường cong trái tim & вектор pháp tuyến chuẩn theo độ dài cung
       */
      var OUT_N = 1200;
      var outline = [];
      var cumLen = [];
      var totalLen = 0;
      var OFFSET_Y = 2.3;
      var HEART_WIDTH = 16 * 0.8 * 1.1 * 1.05; // Tăng bề ngang hiện tại thêm 5%

      (function buildOutline() {
        var i, t, s;
        for (i = 0; i < OUT_N; i++) {
          t = (i / OUT_N) * Math.PI * 2;
          s = Math.sin(t);
          outline.push({
            x: HEART_WIDTH * s * s * s,
            y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
          });
        }
        for (i = 0; i < OUT_N; i++) {
          var prev = outline[(i - 4 + OUT_N) % OUT_N];
          var next = outline[(i + 4) % OUT_N];
          var dx = next.x - prev.x;
          var dy = next.y - prev.y;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          outline[i].nx = dy / len;
          outline[i].ny = -dx / len;
          if (i > 0) {
            var px = outline[i].x - outline[i - 1].x;
            var py = outline[i].y - outline[i - 1].y;
            totalLen += Math.sqrt(px * px + py * py);
          }
          cumLen.push(totalLen);
        }

        // Độ gồ ghề tự nhiên cho lớp rìa ngoài
        var p1 = 1.2, p2 = 3.7, p3 = 5.1;
        for (i = 0; i < OUT_N; i++) {
          var u = (i / OUT_N) * Math.PI * 2;
          outline[i].clump = 0.78 + 0.26 * Math.sin(u * 3 + p1) + 0.18 * Math.sin(u * 7 + p2) + 0.14 * Math.sin(u * 13 + p3);
        }
      })();

      function sampleOutline() {
        var target = Math.random() * totalLen;
        var lo = 0, hi = OUT_N - 1;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (cumLen[mid] < target) lo = mid + 1;
          else hi = mid;
        }
        return outline[lo];
      }

      /*
       * Khởi tạo các hạt tĩnh & hạt động
       */
      var staticParticles = [];
      var dynamicSparks = [];

      function initParticles() {
        staticParticles = [];
        var i, o, d, u, c, alpha, size, push;

        // 1. Lớp rìa ngoài đỏ đô (Halo) - vẽ trước để nằm dưới
        for (i = 0; i < CONFIG.haloCount; i++) {
          o = sampleOutline();
          d = 0.5 + Math.abs(gauss()) * 1.35 * o.clump + expRand(0.18);
          u = d + gauss() * 0.3;
          if (u < 0.9) c = Math.random() < 0.35 ? 3 : 5;
          else if (u < 1.8) c = Math.random() < 0.6 ? 5 : 6;
          else if (u < 2.8) c = Math.random() < 0.6 ? 6 : 7;
          else c = 7;

          alpha = rand(0.45, 0.92);
          size = rand(0.32, 0.65);
          push = rand(0.15, 0.55);

          staticParticles.push({
            x: o.x + o.nx * d,
            y: o.y + o.ny * d,
            nx: o.nx,
            ny: o.ny,
            c: c,
            alpha: alpha,
            size: size,
            push: push,
            phase: Math.random() * Math.PI * 2,
            twinkleSpeed: rand(1.5, 3.5)
          });
        }

        // 2. Lớp lòng tim (Inner) - thưa ở giữa, dày dần ra mép
        for (i = 0; i < CONFIG.innerCount; i++) {
          o = sampleOutline();
          var x, y;
          if (Math.random() < 0.62) {
            d = -1.05 - Math.min(5.5, expRand(1.55));
            x = o.x + o.nx * d;
            y = o.y + o.ny * d;
          } else {
            var r = Math.sqrt(Math.random()) * 0.82;
            var cy0 = 1.5;
            x = o.x * r;
            y = cy0 + (o.y - cy0) * r;
          }
          var roll = Math.random();
          c = roll < 0.55 ? 4 : roll < 0.8 ? 5 : roll < 0.94 ? 3 : 2;
          staticParticles.push({
            x: x,
            y: y,
            nx: o.nx,
            ny: o.ny,
            c: c,
            alpha: rand(0.24, 0.62),
            size: rand(0.24, 0.46),
            push: 0.04,
            phase: Math.random() * Math.PI * 2,
            twinkleSpeed: rand(1.2, 3.0)
          });
        }

        // 3. Lớp viền sáng hồng san hô (Band) - vẽ trên cùng
        for (i = 0; i < CONFIG.bandCount; i++) {
          o = sampleOutline();
          d = gauss() * 0.7 - 0.35;
          u = d + gauss() * 0.25;
          if (Math.random() < 0.14 && Math.abs(d + 0.35) < 0.75) c = 0;
          else if (u < -1.3) c = 4;
          else if (u < -0.8) c = 3;
          else if (u < 0.12) c = Math.random() < 0.55 ? 1 : 2;
          else if (u < 0.7) c = 2;
          else c = 3;

          alpha = Math.max(0.38, 1 - Math.abs(d + 0.35) * 0.34) * rand(0.78, 1);
          size = rand(0.28, 0.54);

          staticParticles.push({
            x: o.x + o.nx * d,
            y: o.y + o.ny * d,
            nx: o.nx,
            ny: o.ny,
            c: c,
            alpha: alpha,
            size: size,
            push: rand(0.05, 0.18),
            phase: Math.random() * Math.PI * 2,
            twinkleSpeed: rand(1.8, 4.2)
          });
        }

        // 4. Hạt bụi bay nhẹ quanh viền (Sparks)
        dynamicSparks = [];
        for (i = 0; i < CONFIG.sparkCount; i++) {
          var sp = {};
          resetSpark(sp, true);
          dynamicSparks.push(sp);
        }
      }

      function resetSpark(sp, initial) {
        var o = sampleOutline();
        var d = 0.75 + Math.abs(gauss()) * 0.85;
        var speed = rand(0.4, 1.45);
        sp.x = o.x + o.nx * d;
        sp.y = o.y + o.ny * d;
        sp.vx = o.nx * speed + gauss() * 0.2;
        sp.vy = o.ny * speed + gauss() * 0.2;
        sp.life = rand(1.4, 2.8);
        sp.age = initial ? Math.random() * sp.life : 0;
        sp.c = Math.random() < 0.35 ? 3 : Math.random() < 0.7 ? 5 : 6;
        sp.size = rand(0.28, 0.52);
      }

      /*
       * Pre-render trái tim cơ sở lên Offscreen Canvas (giúp phóng to/thu nhỏ mượt tuyệt đối 120fps)
       */
      var baseCanvas = document.createElement('canvas');
      var baseCtx = baseCanvas.getContext('2d');
      var W = 0, H = 0, DPR = 1, unit = 1, cx = 0, cy = 0;

      function renderStaticBase() {
        baseCanvas.width = W;
        baseCanvas.height = H;
        baseCtx.clearRect(0, 0, W, H);

        for (var i = 0; i < staticParticles.length; i++) {
          var p = staticParticles[i];
          var x = cx + p.x * unit;
          var y = cy + (p.y - OFFSET_Y) * unit;
          var sz = p.size * unit;
          baseCtx.globalAlpha = p.alpha * 0.88;
          baseCtx.drawImage(SPRITES[p.c], x - sz / 2, y - sz / 2, sz, sz);
        }
        baseCtx.globalAlpha = 1;
      }

      // Chọn ra 1 nhóm hạt lấp lánh & giãn nở phụ để tạo sự sống động nội tại mà không tốn CPU
      var livelyParticles = [];
      function pickLivelyParticles() {
        livelyParticles = [];
        var step = isMobile ? 5 : 4;
        for (var i = 0; i < staticParticles.length; i += step) {
          livelyParticles.push(staticParticles[i]);
        }
      }

      function onResize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        var rect = canvas.getBoundingClientRect();
        W = canvas.width = Math.max(1, Math.floor(rect.width * DPR));
        H = canvas.height = Math.max(1, Math.floor(rect.height * DPR));
        cx = W / 2;
        cy = H / 2;
        unit = Math.min(W, H) * 0.0235;
        renderStaticBase();
      }

      /*
       * Hàm nhịp đập trái tim mượt mà (Continuous C2 Smooth Lub-Dub Curve)
       * Không có bất kỳ điểm gãy đạo hàm nào -> chuyển động co bóp mềm như lụa
       */
      function cycleDistance(phase, center) {
        var distance = Math.abs(phase - center);
        return Math.min(distance, 1 - distance);
      }

      function smoothHeartbeat(t) {
        var P = CONFIG.beatPeriod;
        var phase = ((t % P) + P) % P / P; // 0 -> 1, luon lien mach khi lap vong

        // Nhịp 1 (Lub - mạnh và ấm) tại phase = 0.18
        var d1 = cycleDistance(phase, 0.18);
        var lub = 1.2 * Math.exp(-(d1 * d1) / 0.0095);

        // Nhịp 2 (Dub - nảy nhẹ theo sau) tại phase = 0.38
        var d2 = cycleDistance(phase, 0.38);
        var dub = 0.78 * Math.exp(-(d2 * d2) / 0.0105);

        // Độ thu nhẹ thư giãn trước khi vào nhịp đập mới (tạo cảm giác lấy đà co cơ tim)
        var d0 = cycleDistance(phase, 0.06);
        var preDip = -0.24 * Math.exp(-(d0 * d0) / 0.006);

        // Co giãn nhẹ giữa hai nhịp để trái tim luôn có chuyển động liên tục.
        var restPulse = 0.06 + 0.025 * Math.sin(phase * Math.PI * 2 - 0.6);

        return restPulse + lub + dub + preDip;
      }

      var smoothBeat = 0;
      var lastTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);

        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var t = now / 1000;

        // Bộ lọc làm mượt quán tính (Spring/Lerp smoothing) giúp loại bỏ hoàn toàn hiện tượng giật cục
        var targetBeat = smoothHeartbeat(t);
        var smoothing = 1 - Math.exp(-dt * 18);
        smoothBeat += (targetBeat - smoothBeat) * smoothing;

        var beatPos = Math.max(0, smoothBeat);
        var breath = Math.sin(t * 1.6) * 0.008;
        var heartScale = 1 + breath + smoothBeat * 0.15;

        // Đồng bộ quầng sáng nền bằng GPU CSS
        var glowScale = 0.95 + beatPos * 0.24;
        var glowAlpha = 0.65 + Math.min(0.35, beatPos * 0.35);
        glowEl.style.transform = 'scale(' + glowScale.toFixed(4) + ')';
        glowEl.style.opacity = glowAlpha.toFixed(3);

        // Xóa khung hình
        ctx.clearRect(0, 0, W, H);

        // 1. Vẽ lớp nền trái tim co bóp bằng phép biến đổi ma trận (siêu mượt, sub-pixel interpolation)
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(heartScale, heartScale);
        ctx.translate(-cx, -cy);
        ctx.drawImage(baseCanvas, 0, 0);

        // 2. Vẽ lớp hạt lấp lánh & bung nhẹ theo nhịp đập để tạo chiều sâu sống động 3D
        ctx.globalCompositeOperation = 'lighter';
        var pulsePush = beatPos * 0.7;

        for (var i = 0; i < livelyParticles.length; i++) {
          var p = livelyParticles[i];
          var tw = 0.5 + 0.5 * Math.sin(t * p.twinkleSpeed + p.phase);
          if (tw < 0.35 && beatPos < 0.2) continue;

          var expand = p.push * pulsePush;
          var x = cx + (p.x + p.nx * expand) * unit;
          var y = cy + (p.y - OFFSET_Y + p.ny * expand) * unit;
          var sz = p.size * unit * (0.9 + 0.35 * tw + 0.2 * beatPos);

          ctx.globalAlpha = p.alpha * tw * (0.45 + 0.45 * beatPos);
          ctx.drawImage(SPRITES[p.c], x - sz / 2, y - sz / 2, sz, sz);
        }

        // 3. Vẽ các hạt bụi bay tản ra mềm mại quanh rìa
        ctx.globalCompositeOperation = 'source-over';
        var burstSpeed = 1 + beatPos * 2.4;
        for (var j = 0; j < dynamicSparks.length; j++) {
          var sp = dynamicSparks[j];
          sp.age += dt;
          if (sp.age >= sp.life) {
            resetSpark(sp, false);
          }
          sp.x += sp.vx * dt * burstSpeed;
          sp.y += sp.vy * dt * burstSpeed;

          var lifeRatio = sp.age / sp.life;
          var a = Math.sin(lifeRatio * Math.PI) * 0.85;
          var sx = cx + sp.x * unit;
          var sy = cy + (sp.y - OFFSET_Y) * unit;
          var ssz = sp.size * unit * (1 - lifeRatio * 0.45);

          ctx.globalAlpha = a;
          ctx.drawImage(SPRITES[sp.c], sx - ssz / 2, sy - ssz / 2, ssz, ssz);
        }

        ctx.restore();
        ctx.globalAlpha = 1;
      }

      initParticles();
      pickLivelyParticles();
      onResize();
      window.addEventListener('resize', onResize);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
