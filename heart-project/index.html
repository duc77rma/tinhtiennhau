<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Heart</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06060d;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
  </style>
</head>

<body>
  <canvas id="heart"></canvas>

  <script>
    (function () {
      var canvas = document.getElementById('heart');
      var ctx = canvas.getContext('2d');
      var isMobile = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);

      /*
       * Settings
       */
      var CONFIG = {
        edgeCount: isMobile ? 2600 : 5200,   // hạt viền sáng dày đặc
        innerCount: isMobile ? 900 : 1800,   // hạt thưa bên trong lòng tim
        haloCount: isMobile ? 1100 : 2400,   // hạt đỏ đô lởm chởm rìa ngoài
        sparkCount: isMobile ? 120 : 260,    // hạt bay tản ra từ viền
        beatPeriod: 1.2,                     // chu kỳ 1 nhịp tim (giây)
        beatStrength: 0.07,                  // biên độ phồng khi đập
        heartSize: 0.019                     // tỷ lệ kích thước tim so với cạnh nhỏ màn hình
      };

      var W, H, DPR, unit, cx, cy, bgGradient, glowGradient;
      var particles = [];
      var sparks = [];

      /*
       * Helpers
       */
      function gauss() {
        var u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      // Phương trình trái tim (trục y hướng xuống theo hệ tọa độ canvas)
      function heartPoint(t) {
        var s = Math.sin(t);
        return {
          x: 16 * s * s * s,
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      // Tâm để co/giãn hạt vào trong lòng tim
      var HC = { x: 0, y: 1 };
      // Dịch tim để căn giữa theo chiều dọc
      var OFFSET_Y = 2.5;

      // Tạo sprite chấm sáng mềm (glow dot)
      function makeSprite(r, g, b) {
        var size = 32;
        var c = document.createElement('canvas');
        c.width = c.height = size;
        var g2 = c.getContext('2d');
        var grad = g2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
        grad.addColorStop(0.3, 'rgba(' + r + ',' + g + ',' + b + ',0.75)');
        grad.addColorStop(0.6, 'rgba(' + r + ',' + g + ',' + b + ',0.18)');
        grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
        g2.fillStyle = grad;
        g2.fillRect(0, 0, size, size);
        return c;
      }

      // Bảng màu theo ảnh mẫu
      var SPRITES = {
        highlight: makeSprite(255, 214, 220), // hồng gần trắng (điểm sáng nhất trên viền)
        edge: makeSprite(255, 128, 150),      // hồng san hô sáng (viền chính)
        edgeDeep: makeSprite(235, 80, 110),   // hồng đậm (viền phụ)
        inner: makeSprite(190, 50, 80),       // đỏ hồng tối (lòng tim)
        halo: makeSprite(140, 18, 45),        // đỏ đô / maroon (rìa ngoài)
        spark: makeSprite(220, 60, 95)        // tàn hạt bay
      };

      /*
       * Particle generation
       */
      function createParticle(layer) {
        var t = Math.random() * Math.PI * 2;
        var P = heartPoint(t);
        var r, sprite, size, alpha, jitter;

        if (layer === 'edge') {
          r = 1 + gauss() * 0.028;
          var roll = Math.random();
          sprite = roll < 0.22 ? SPRITES.highlight : roll < 0.75 ? SPRITES.edge : SPRITES.edgeDeep;
          size = rand(0.2, 0.42);
          alpha = rand(0.45, 0.95);
          jitter = rand(0.03, 0.09);
        } else if (layer === 'inner') {
          // dày hơn khi gần viền, thưa dần vào tâm
          r = Math.pow(Math.random(), 0.55) * 0.93;
          sprite = Math.random() < 0.25 ? SPRITES.edgeDeep : SPRITES.inner;
          size = rand(0.16, 0.32);
          alpha = rand(0.25, 0.65);
          jitter = rand(0.04, 0.12);
        } else {
          // halo: lởm chởm bên ngoài viền
          r = 1.035 + Math.abs(gauss()) * 0.085;
          sprite = Math.random() < 0.2 ? SPRITES.inner : SPRITES.halo;
          size = rand(0.22, 0.5);
          alpha = rand(0.4, 0.9);
          jitter = rand(0.06, 0.16);
        }

        return {
          bx: HC.x + (P.x - HC.x) * r + gauss() * 0.12,
          by: HC.y + (P.y - HC.y) * r + gauss() * 0.12,
          layer: layer,
          sprite: sprite,
          size: size,
          alpha: alpha,
          jitter: jitter,
          phase: Math.random() * Math.PI * 2,
          tw: rand(1.5, 4.5) // tốc độ lấp lánh
        };
      }

      function resetSpark(s, initial) {
        var t = Math.random() * Math.PI * 2;
        var P = heartPoint(t);
        var dx = P.x - HC.x;
        var dy = P.y - HC.y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        s.x = P.x * 1.02;
        s.y = P.y * 1.02;
        s.vx = (dx / len) * rand(0.6, 1.8) + gauss() * 0.25;
        s.vy = (dy / len) * rand(0.6, 1.8) + gauss() * 0.25;
        s.life = rand(1.4, 3);
        s.age = initial ? Math.random() * s.life : 0;
        s.size = rand(0.18, 0.38);
      }

      function buildParticles() {
        particles = [];
        var i;
        for (i = 0; i < CONFIG.haloCount; i++) particles.push(createParticle('halo'));
        for (i = 0; i < CONFIG.innerCount; i++) particles.push(createParticle('inner'));
        for (i = 0; i < CONFIG.edgeCount; i++) particles.push(createParticle('edge'));

        sparks = [];
        for (i = 0; i < CONFIG.sparkCount; i++) {
          var s = {};
          resetSpark(s, true);
          sparks.push(s);
        }
      }

      /*
       * Responsive resize
       */
      function onResize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = Math.floor(window.innerWidth * DPR);
        H = canvas.height = Math.floor(window.innerHeight * DPR);
        cx = W / 2;
        cy = H / 2;
        unit = Math.min(W, H) * CONFIG.heartSize;

        // Nền đen pha xanh navy giống ảnh mẫu
        bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
        bgGradient.addColorStop(0, '#12111f');
        bgGradient.addColorStop(0.55, '#0a0a15');
        bgGradient.addColorStop(1, '#040408');

        // Quầng đỏ mờ phía sau trái tim
        glowGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, unit * 22);
        glowGradient.addColorStop(0, 'rgba(150, 20, 55, 0.22)');
        glowGradient.addColorStop(0.5, 'rgba(110, 10, 40, 0.08)');
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      }

      /*
       * Render loop
       */
      var lastTime = performance.now();

      function render(now) {
        requestAnimationFrame(render);

        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var t = now / 1000;

        // Nhịp tim kép "lub-dub"
        var p = (t % CONFIG.beatPeriod) / CONFIG.beatPeriod;
        var beat = Math.exp(-Math.pow((p - 0.12) / 0.06, 2)) +
          0.55 * Math.exp(-Math.pow((p - 0.32) / 0.07, 2));
        var scale = unit * (1 + CONFIG.beatStrength * beat);

        // Nền
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, W, H);

        // Quầng sáng đập theo nhịp
        ctx.globalAlpha = 0.6 + 0.4 * beat;
        ctx.fillStyle = glowGradient;
        ctx.fillRect(0, 0, W, H);

        // Hạt phát sáng cộng dồn
        ctx.globalCompositeOperation = 'lighter';

        for (var i = 0; i < particles.length; i++) {
          var pt = particles[i];
          var k = pt.layer === 'halo' ? 1 + beat * 0.045 : 1;
          var jx = Math.sin(t * 1.3 + pt.phase) * pt.jitter;
          var jy = Math.cos(t * 1.1 + pt.phase * 1.7) * pt.jitter;

          var x = cx + (pt.bx * k + jx) * scale;
          var y = cy + ((pt.by - OFFSET_Y) * k + jy) * scale;
          var sz = pt.size * scale;

          ctx.globalAlpha = pt.alpha * (0.6 + 0.4 * Math.sin(t * pt.tw + pt.phase));
          ctx.drawImage(pt.sprite, x - sz / 2, y - sz / 2, sz, sz);
        }

        // Hạt bay tản ra từ viền
        for (var j = 0; j < sparks.length; j++) {
          var s = sparks[j];
          s.age += dt;
          if (s.age >= s.life) resetSpark(s, false);
          s.x += s.vx * dt;
          s.y += s.vy * dt;

          var lifeRatio = s.age / s.life;
          var a = Math.sin(lifeRatio * Math.PI) * 0.7;
          var sx = cx + s.x * scale;
          var sy = cy + (s.y - OFFSET_Y) * scale;
          var ssz = s.size * scale * (1 - lifeRatio * 0.5);

          ctx.globalAlpha = a;
          ctx.drawImage(SPRITES.spark, sx - ssz / 2, sy - ssz / 2, ssz, ssz);
        }
      }

      window.addEventListener('resize', onResize);
      onResize();
      buildParticles();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
